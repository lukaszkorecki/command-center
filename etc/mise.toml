[tools]
java = "temurin-25"
claude = "latest"
babashka = "1.13"
clojure = "latest"
leiningen = "2.13"
node = "26"
rclone = "latest"
fnox = "latest"
1password = "2"
"github:lukaszkorecki/clojure-mcp-light-native" = "0.2.2"
"github:p0deje/Maccy" = {
  version = "2.8.0",
  postinstall = 'mkdir -p "$HOME/Applications" && rm -rf "$HOME/Applications/Maccy.app" && ditto "$MISE_TOOL_INSTALL_PATH" "$HOME/Applications/Maccy.app"'
}

gh = "latest"
jq = "latest"
fzf = "latest"
"github:borkdude/jet" = "latest"
ripgrep = { version = "latest", exe = "rg" }
bat = "latest"
shfmt = "latest"
pandoc = "latest"
clj-kondo = "latest"
"github:clojure-lsp/clojure-lsp" = "latest"

# other
sqlite = "latest"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["node", "java"]
